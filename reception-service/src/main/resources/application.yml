spring:
  application:
    name: reception-service
  datasource:
    url: jdbc:postgresql://localhost:5432/hotelos_reception
    username: postgres
    password: "12345"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    com.hotelos: DEBUG
